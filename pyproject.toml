[project]
name = "media-feed"
version = "0.1.4"
description = "A lightweight ComfyUI media feed for generated images, videos, and audio."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "pajama114" },
]
keywords = [
  "comfyui",
  "media",
  "image-feed",
  "video",
  "audio",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: JavaScript",
]
dependencies = []

[project.urls]
Repository = "https://github.com/pajama114/ComfyUI-Media-Feed"
Issues = "https://github.com/pajama114/ComfyUI-Media-Feed/issues"

[tool.comfy]
PublisherId = "pajama"
DisplayName = "Media Feed"
Icon = "https://raw.githubusercontent.com/pajama114/ComfyUI-Media-Feed/main/icon.png"
